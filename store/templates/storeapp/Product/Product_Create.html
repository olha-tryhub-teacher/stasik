{% extends "base.html" %}

{% block title %}Редагування товару{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4 p-md-5">

                    <h2 class="mb-4 fw-bold text-dark text-center text-md-start">Налаштування товару</h2>
                    <p class="text-muted small">Тут можна змінити назву, ціну, категорію або завантажити нове фото.</p>
                    <hr class="mb-4">

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="product-form-fields">
                            {{ form.as_p }}
                        </div>

                        <div class="d-flex gap-2 justify-content-end mt-5">
                            <a href="{% url 'storeapp:product_list' %}" class="btn btn-light px-4 rounded-3 fw-medium">
                                Скасувати
                            </a>
                            <button type="submit" class="btn text-white px-4 rounded-3 fw-medium" style="background-color: #212529;">
                                Зберегти зміни
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .product-form-fields p {
        margin-bottom: 20px;
    }
    .product-form-fields input,
    .product-form-fields select,
    .product-form-fields textarea {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 6px;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    .product-form-fields input[type="checkbox"] {
        display: inline-block;
        width: auto;
    }
    .product-form-fields input:focus,
    .product-form-fields select:focus,
    .product-form-fields textarea:focus {
        border-color: #212529;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(33, 37, 41, 0.1);
    }
</style>
{% endblock %}
